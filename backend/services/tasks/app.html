<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Tasks</title>
<link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
<style>
/* Notion-like dark theme (always dark). */
:root{--bg:#191919;--panel:#202020;--card:#252525;--hover:#2c2c2c;--ink:#e9e9e7;--muted:#9b9b98;--faint:#6f6f6c;
  --line:#2f2f2f;--accent:#2383e2;--red:#e0645a;--amber:#cb912f;--green:#4dab6f}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14.5px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:1400px;margin:0 auto;padding:18px 20px 80px}
a{color:inherit}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=date]{color-scheme:dark}
h1{font-size:30px;font-weight:700;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);cursor:pointer;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .pin::before{content:"▤ ";opacity:.7}
.tabs .spacer{flex:1}
.tabs .newbtn,.newbtn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;margin:4px 0}
.quick{display:flex;gap:8px;margin:0 0 14px}
.quick[hidden]{display:none}
.quick input{flex:1;min-width:0}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:13.5px}
.plain{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.plain:hover{background:var(--hover)}
.danger{color:var(--red)}
.empty{padding:14px;color:var(--muted)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:13px;line-height:1.55;white-space:nowrap;font-weight:500}
.c-gray{background:#5a5a5a;color:#f0efed}.c-brown{background:#603b2c;color:#f4eeee}.c-orange{background:#854c1d;color:#f8ecdf}
.c-yellow{background:#89632a;color:#fef9e5}.c-green{background:#2b593f;color:#edf3ec}.c-blue{background:#28456c;color:#e7f3f8}
.c-darkblue{background:#1f3a8a;color:#e6ecff}.c-purple{background:#492f64;color:#f6f3f9}.c-pink{background:#69314c;color:#faf1f5}
.c-red{background:#6e3630;color:#fdebec}.c-plain{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #4a4a48}
.t-gray{background:#262626}.t-brown{background:#2b2421}.t-orange{background:#2e261f}.t-yellow{background:#2c2820}
.t-green{background:#222b25}.t-blue{background:#202a33}.t-darkblue{background:#1f2433}.t-purple{background:#29232f}
.t-pink{background:#2f2328}.t-red{background:#2f2322}.t-plain{background:#232323}
.pill{display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:999px;font-size:13px;line-height:1.6;white-space:nowrap;border:0;cursor:pointer}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.s-todo{background:#3a3a3a;color:#cfcfcc}.s-doing{background:#203d5c;color:#7cb7f5}
.s-done{background:#223f2e;color:#7ccf9a}.s-cancelled{background:#4b2826;color:#f19a91}
.prio{display:inline-block;padding:0 7px;border-radius:4px;font-size:13px;line-height:1.6;border:0;cursor:pointer}
.p-low{background:#2b593f;color:#edf3ec}.p-medium{background:#6b4e1c;color:#fdf1d8}.p-high{background:#6e3630;color:#fdebec}
.p-normal{background:transparent;color:var(--faint)}
.due{font-size:13px;color:var(--muted);white-space:nowrap}
.due.over{color:var(--red);font-weight:600}.due.soon{color:var(--amber)}
.prog{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:6px}
.chk{appearance:none;width:16px;height:16px;border:1.5px solid #6b6b68;border-radius:3px;margin:3px 0 0;flex:none;cursor:pointer;background:transparent;display:inline-grid;place-content:center;padding:0}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
h2{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 .n{font-weight:400;text-transform:none}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:8px;padding:7px 8px 7px calc(8px + var(--d,0) * 22px);border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hover)}
.row.cont .title{font-weight:600}
.fold{width:16px;flex:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:11px;line-height:22px}
.fold.none{visibility:hidden}
.row .t{flex:1;min-width:0}
.title{overflow-wrap:anywhere}
.path{color:var(--muted)}
.closed .title,.title.closed{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.ic{color:var(--faint);font-size:12px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 290px;background:#1e1e1e;border-radius:10px;padding:8px;min-height:80px}
.col.drop{outline:2px solid var(--accent)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 8px}
.colh .n{color:var(--muted);font-size:13px}
.card{border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.3);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card:hover{filter:brightness(1.12)}
/* A class/project with nothing matching the ticked statuses: still shown, faded. */
.card.dim,tr.dim td{opacity:.45}.card.dim:hover,tr.dim:hover td{opacity:.8}
.card .top{display:flex;gap:8px;align-items:flex-start}
.card .title{font-weight:600;font-size:15px}
.card .meta{margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.chip{font-size:13px;opacity:.85;cursor:pointer}
.chip::before{content:"✓ ";color:var(--green)}
.chip.open::before{content:"○ ";color:var(--muted)}
.chip:hover{text-decoration:underline}
.colnew{width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:6px 4px;cursor:pointer;border-radius:6px}
.colnew:hover{background:var(--hover)}
.colform input{width:100%}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.85;transform:rotate(2deg);width:270px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{font-size:10px}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#1f1f1f}
td.tt{min-width:260px}
td.tt .in{display:flex;gap:6px;align-items:flex-start;padding-left:calc(var(--d,0) * 20px)}
td.tt .title{cursor:pointer}
td.tt .title:hover{text-decoration:underline}
td input[type=date]{background:transparent;border:0;padding:0;font-size:13px;color:var(--muted);width:122px}
td input[type=date]:hover{background:var(--hover)}
.menu{position:fixed;z-index:60;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);min-width:150px}
.menu button{display:flex;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-radius:5px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;z-index:40;overflow-y:auto}
.shade[hidden]{display:none}
.page{width:min(860px,100%);min-height:100%;background:var(--panel);margin:0 auto;padding:22px 56px 60px;box-shadow:0 0 60px rgba(0,0,0,.6)}
.pbar{display:flex;gap:8px;align-items:center;margin-bottom:26px;color:var(--muted);font-size:13.5px}
.pbar .crumb{flex:1;overflow-wrap:anywhere}
.crumb a{cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
.ptitle{width:100%;background:transparent;border:0;font-size:36px;font-weight:700;padding:0;margin:0 0 18px;line-height:1.2;resize:none;overflow:hidden}
.ptitle:focus{outline:none}
.props{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;align-items:center;margin-bottom:22px}
.props .k{color:var(--muted);font-size:14px;padding:5px 0}
.props .v{padding:3px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.props select{max-width:100%}
.notes{border-top:1px solid var(--line);padding-top:14px;min-height:60px;cursor:text}
.notes.empty-n{color:var(--faint)}
.md h1,.md h2,.md h3{text-transform:none;letter-spacing:0;color:var(--ink);margin:14px 0 6px;display:block}
.md h1{font-size:24px}.md h2{font-size:19px}.md h3{font-size:16px}
.md p{margin:6px 0;overflow-wrap:anywhere}
.md ul{margin:4px 0;padding-left:22px}.md li{margin:2px 0;overflow-wrap:anywhere}
.md li.todo{list-style:none;display:flex;gap:6px;align-items:flex-start}
.md li.todo.ticked span{text-decoration:line-through;color:var(--muted)}
.md a{color:var(--ink);text-decoration:underline;text-decoration-color:#6b6b68}
.md code{background:#2f2f2f;color:#eb5757;padding:1px 4px;border-radius:4px;font-size:.9em}
.md pre{background:#2a2a2a;padding:10px;border-radius:6px;overflow-x:auto}
.md pre code{background:none;color:var(--ink);padding:0}
.notesedit{width:100%;min-height:200px;background:transparent;border:1px solid var(--line);font:14px/1.55 ui-monospace,Menlo,monospace}
.saved{font-size:12px;color:var(--faint);min-height:16px;margin:6px 0}
.subadd{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.subadd input[type=text]{flex:1;min-width:160px}
.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#e9e9e7;color:#191919;padding:8px 14px;border-radius:999px;font-size:14px;z-index:70}
.msg[hidden]{display:none}
.msg{display:flex;gap:12px;align-items:center}
.msg .undo{background:none;border:0;color:#2383e2;font-weight:700;cursor:pointer;padding:0}
@media(max-width:700px){main{padding:12px 12px 80px}h1{font-size:24px}.page{padding:16px 18px 50px}.ptitle{font-size:28px}
  .props{grid-template-columns:105px 1fr}.col{flex-basis:84vw}.row{padding-left:calc(6px + var(--d,0) * 14px)}}

/* Jump to top / bottom (bottom-right; only when there's something to scroll). */
.jump{position:fixed;right:14px;bottom:62px;z-index:65;display:flex;flex-direction:column;gap:6px}
.jump[hidden]{display:none}
.jump button{width:38px;height:38px;border-radius:50%;border:1px solid #3a3a3a;background:#2a2a2a;color:#e9e9e7;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:.85}
.jump button:hover{opacity:1;background:#333}
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <p class="sub">Stay organized with tasks, your way.</p>
  <div class="tabs" id="tabs"></div>
  <form class="quick" id="quick" hidden>
    <input name="title" placeholder="New task or idea (just a title is fine)" autocomplete="off" required>
    <select name="group" aria-label="Category"></select>
    <button class="newbtn">Add</button>
  </form>
  <section id="view"></section>
</main>

<div class="shade" id="shade" hidden>
  <article class="page" id="page" role="dialog" aria-label="Task">
    <div class="pbar">
      <span class="crumb" id="crumb"></span>
      <button class="plain" id="pinT" type="button"></button>
      <button class="plain" id="closeP" type="button">Close</button>
    </div>
    <textarea class="ptitle" id="dTitle" rows="1" aria-label="Title"></textarea>
    <div class="props">
      <div class="k">Status</div><div class="v" id="pStatus"></div>
      <div class="k">Category</div><div class="v" id="pGroup"></div>
      <div class="k">Due date</div><div class="v"><input type="date" id="dDue"></div>
      <div class="k">Priority</div><div class="v" id="pPrio"></div>
      <div class="k">Inside</div><div class="v"><select id="dParent"></select></div>
      <div class="k">Course / project</div><div class="v"><label><input type="checkbox" class="chk" id="dCont"> Container (shows progress, no checkbox)</label></div>
      <div class="k">Archived</div><div class="v"><label><input type="checkbox" class="chk" id="dArch"> Hide it (e.g. course finished)</label></div>
    </div>
    <div class="notes md" id="notesView" title="Click to edit"></div>
    <textarea class="notesedit" id="notesEdit" hidden placeholder="Notes (Markdown: - bullets, - [ ] checklists, [text](link), **bold**)"></textarea>
    <div class="saved" id="saved"></div>
    <h2>Inside this <span class="n" id="subN"></span></h2>
    <div class="list" id="subList"></div>
    <form class="subadd" id="subAdd">
      <input type="text" name="title" placeholder="Add a subtask…" required>
      <input type="date" name="due" aria-label="Subtask due date">
      <button class="plain">Add</button>
    </form>
    <p style="margin-top:28px"><button class="plain danger" id="delT" type="button">Delete</button></p>
  </article>
</div>
<div class="jump" id="jump" hidden><button type="button" id="jumpTop" title="Top" aria-label="Go to top">↑</button><button type="button" id="jumpEnd" title="Bottom" aria-label="Go to bottom">↓</button></div>
<div class="msg" id="msg" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem("tasks." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tasks." + k, JSON.stringify(v)); } catch {} } };
let S = { groups: [], tasks: [] };
let tab = store.get("tab", "board"), openId = null, editingNotes = false;
const folded = new Set(store.get("folded", []));
// Which statuses show on the Board, the Table, and pinned tabs (one shared setting).
// Focus = In progress; Undone = Not started + In progress; Full = all four.
const shown = new Set(store.get("statuses", ["doing"]));
let sort = store.get("sort", null);
// A task shows if its status is ticked. An open container (a class or project that's Not started
// or In progress) always shows, whatever is ticked, until it's deleted or archived; one with
// nothing matching inside is dimmed. A Done or Cancelled container follows the ticks like a task.
const matches = (t) => !archivedChain(t) && ((t.container && !isClosed(t)) || shown.has(t.status));
const dimmed = (t) => t.container && !isClosed(t) && !descendants(t.id).some((d) => !d.container && shown.has(d.status));
function statusFilter() {
  const bar = el("div", "tools");
  for (const s of ["todo", "doing", "done", "cancelled"]) {
    const lab = el("label"), cb = el("input", "chk"); cb.type = "checkbox"; cb.checked = shown.has(s);
    cb.onchange = () => { cb.checked ? shown.add(s) : shown.delete(s); store.set("statuses", [...shown]); render(); };
    lab.append(cb, " ", el("span", "pill s-" + s, ST[s])); bar.append(lab);
  }
  return bar;
}

// ---------- API ----------
async function api(method, path, body) {
  const r = await fetch("/tasks/api/" + path, { method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Tasks": "1" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { location.reload(); throw new Error("login"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { toast(data.error || "Something went wrong."); throw new Error(data.error); }
  return data;
}
async function refresh() { S = await api("GET", "state"); index(); render(); }
// The message at the bottom. With `undo`, it gets an Undo button for a few seconds.
function toast(text, undo) {
  const m = $("msg"); m.replaceChildren(el("span", null, text)); m.hidden = false;
  if (undo) {
    const b = el("button", "undo", "Undo"); b.type = "button";
    b.onclick = async () => { m.hidden = true; clearTimeout(toast.t); await undo(); toast("Undone."); };
    m.append(b);
  }
  clearTimeout(toast.t); toast.t = setTimeout(() => (m.hidden = true), undo ? 6000 : 2400);
}
// Every change to a task goes through here, so the last one can be undone: it remembers the
// old values of exactly the fields it changed and puts them back.
const LABEL = { status: "Status", group: "Category", priority: "Priority", due: "Due date", title: "Title",
  parent: "Moved", container: "Container", archived: "Archived", notes: "Notes", pinned: "Pin" };
// Adding a task: Undo deletes it again.
async function addTask(body) {
  const t = await api("POST", "tasks", body);
  await refresh();
  toast(`Added: ${t.title}`, async () => { await api("DELETE", "tasks/" + t.id); await refresh(); });
}
async function patch(t, fields, message) {
  const before = {}; for (const k of Object.keys(fields)) before[k] = t[k] ?? null;
  await api("PATCH", "tasks/" + t.id, fields);
  await refresh();
  const what = message || (Object.keys(fields).length === 1 ? `${LABEL[Object.keys(fields)[0]] || "Changed"}: ${t.title}` : `Changed: ${t.title}`);
  toast(what, async () => { await api("PATCH", "tasks/" + t.id, before); await refresh(); });
}

// ---------- model ----------
let BY = new Map(), KIDS = new Map();
function index() {
  BY = new Map(S.tasks.map((t) => [t.id, t])); KIDS = new Map();
  for (const t of S.tasks) { const k = t.parent || "root:" + (t.group || ""); if (!KIDS.has(k)) KIDS.set(k, []); KIDS.get(k).push(t); }
}
const kids = (id) => KIDS.get(id) || [];
const tops = (gid) => KIDS.get("root:" + (gid || "")) || [];
const group = (id) => S.groups.find((g) => g.id === id);
const isClosed = (t) => t.status === "done" || t.status === "cancelled";
function chain(t) { const out = []; let p = t.parent && BY.get(t.parent); while (p) { out.unshift(p); p = p.parent && BY.get(p.parent); } return out; }
function descendants(id) { const out = [], st = [...kids(id)]; while (st.length) { const t = st.pop(); out.push(t); st.push(...kids(t.id)); } return out; }
const archivedChain = (t) => t.archived || chain(t).some((p) => p.archived);
function progress(t) { const ds = descendants(t.id).filter((d) => !d.container && d.status !== "cancelled"); return ds.length ? `${ds.filter((d) => d.status === "done").length}/${ds.length}` : ""; }
const DEFAULT_COLOR = { school: "yellow", health: "blue", chores: "purple", personal: "purple", music: "pink", professional: "darkblue", nerd: "green", financial: "gray", people: "red" };
const colorOf = (g) => (g ? g.color || DEFAULT_COLOR[g.name.toLowerCase()] || "gray" : "plain");
const ST = { todo: "Not started", doing: "In progress", done: "Done", cancelled: "Cancelled" };
const PR = { normal: "None", low: "Low", medium: "Medium", high: "High" };
const prioRank = { high: 0, medium: 1, normal: 2, low: 3 }, stRank = { doing: 0, todo: 1, done: 2, cancelled: 3 };
const order = (a, b) => (b.container - a.container) || stRank[a.status] - stRank[b.status] || (a.due || "9999").localeCompare(b.due || "9999") || prioRank[a.priority] - prioRank[b.priority] || a.title.localeCompare(b.title);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
function dueLabel(d) {
  const days = Math.round((new Date(d + "T12:00:00") - new Date(today() + "T12:00:00")) / 864e5);
  if (days === 0) return "Today"; if (days === 1) return "Tomorrow"; if (days === -1) return "Yesterday";
  if (days < 0 && days > -7) return `${-days} days ago`;
  if (days > 0 && days < 7) return new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" });
  return new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: d.slice(0, 4) === today().slice(0, 4) ? undefined : "numeric" });
}

// ---------- small UI pieces ----------
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tag(g) { return el("span", "tag c-" + colorOf(g), g ? g.name : "Unsorted"); }
function dueEl(t) {
  if (!t.due) return null;
  const closed = isClosed(t), over = !closed && t.due < today(), soon = !closed && !over && t.due <= addDays(today(), 3);
  return el("span", "due" + (over ? " over" : soon ? " soon" : ""), dueLabel(t.due));
}
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function menu(anchor, items, pick) {
  closeMenu();
  const m = el("div", "menu"); menuEl = m;
  items.forEach(([value, node]) => { const b = el("button"); b.type = "button"; b.append(node); b.onclick = (e) => { e.stopPropagation(); closeMenu(); pick(value); }; m.append(b); });
  document.body.append(m);
  const r = anchor.getBoundingClientRect();

// ---------- Markdown (light): text is escaped first; only http(s)/mailto links are allowed ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const keep = []; const hold = (h) => `\u0000${keep.push(h) - 1}\u0000`;
  s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));

  s = s.replace(/\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?'"]/g, (u) => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])[*_]([^*_\s][^*_]*)[*_](?=$|[\s).,!?])/g, "$1<i>$2</i>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function md(text) {

  const flush = () => { if (para.length) { out += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const endList = () => { if (inList) { out += "</ul>"; inList = false; } };
  const indent = (sp) => Math.min(sp.replace(/\t/g, "  ").length, 12) * 9;
  for (const ln of lines) {
    if (/^\s*```/.test(ln)) { flush(); endList(); out += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; continue; }
    if (inCode) { out += esc(ln) + "\n"; continue; }
    let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { flush(); endList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if ((m = ln.match(/^(\s*)[-*]\s+\[([ xX])\]\s*(.*)/))) {
      flush(); if (!inList) { out += "<ul>"; inList = true; }
      const on = m[2] !== " ";
      out += `<li class="todo${on ? " ticked" : ""}" style="margin-left:${indent(m[1]) - 20}px"><input type="checkbox" class="chk" data-box="${box++}"${on ? " checked" : ""}><span>${inline(m[3])}</span></li>`;
      continue;
    }
    if ((m = ln.match(/^(\s*)(?:[-*]|\d+\.)\s+(.*)/))) { flush(); if (!inList) { out += "<ul>"; inList = true; } out += `<li style="margin-left:${indent(m[1])}px">${inline(m[2])}</li>`; continue; }
    if (!ln.trim()) { flush(); endList(); continue; }
    endList(); para.push(ln);
  }

  return out;
}

  let i = -1;
  return text.replace(/^(\s*[-*]\s+\[)([ xX])(\])/gm, (m, a, x, b) => (++i === n ? a + (x === " " ? "x" : " ") + b : m));

  $("delT").textContent = descendants(t.id).length ? "Delete (with everything inside)" : "Delete";
}
async function save(fields, message) { const t = BY.get(openId); if (!t) return; $("saved").textContent = "Saving…"; await patch(t, fields, message); $("saved").textContent = "Saved."; }
$("dTitle").oninput = fitTitle;
addEventListener("resize", fitTitle);
$("dTitle").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } };
$("dTitle").onchange = () => save({ title: $("dTitle").value });
$("dDue").onchange = () => save({ due: $("dDue").value || null });
$("dParent").onchange = () => save({ parent: $("dParent").value || null });
$("dCont").onchange = () => save({ container: $("dCont").checked });
$("dArch").onchange = () => save({ archived: $("dArch").checked });
$("pinT").onclick = () => { const t = BY.get(openId); save({ pinned: !t.pinned }, t.pinned ? "Tab removed" : "Pinned as a tab"); };
$("notesView").onclick = (e) => {
  const t = BY.get(openId), box = e.target.closest("input[data-box]");
  if (box) { e.preventDefault(); save({ notes: toggleBox(t.notes, +box.dataset.box) }); return; }
  if (e.target.closest("a")) return;
  editingNotes = true; $("notesView").hidden = true; const ne = $("notesEdit"); ne.hidden = false; ne.value = t.notes || ""; ne.focus();
};
$("notesEdit").onblur = () => { const t = BY.get(openId), v = $("notesEdit").value; editingNotes = false; if (t && v !== (t.notes || "")) save({ notes: v }); else fillPage(); };
$("subAdd").onsubmit = async (e) => { e.preventDefault(); const f = e.target, body = { title: f.title.value, parent: openId, due: f.due.value || null }; f.reset(); await addTask(body); };
$("delT").onclick = async () => {
  const t = BY.get(openId), n = descendants(openId).length;
  if (!confirm(`Delete "${t.title}"${n ? ` and the ${n} task${n > 1 ? "s" : ""} inside it` : ""}?`)) return;
  await api("DELETE", "tasks/" + openId); closeTask(); refresh();
};
$("closeP").onclick = closeTask;
$("shade").onclick = (e) => { if (e.target === $("shade")) closeTask(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (menuEl) closeMenu(); else if (openId && !editingNotes) closeTask(); } });

refresh();

// Jump buttons: scroll the open record/task page if there is one, else the main page.
(() => {
  const box = document.getElementById("jump"), shade = document.getElementById("shade");
  const target = () => (shade && !shade.hidden ? shade : document.scrollingElement);
  // Only touch the DOM when the answer changes, and never react to the buttons' own change
  // (watching our own "hidden" flip would loop forever and freeze the page).
  const update = () => { const t = target(), hide = t.scrollHeight <= t.clientHeight + 40; if (box.hidden !== hide) box.hidden = hide; };
  let queued = false; const later = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; update(); }); } };
  // Own quick animation (the browser's smooth scroll can't be sped up): 200 ms, ease-out.
  const glide = (t, to) => {
    const from = t.scrollTop, dist = to - from, t0 = performance.now(), ms = 200;
    if (Math.abs(dist) < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) { t.scrollTop = to; return; }
    const step = (now) => { const k = Math.min(1, (now - t0) / ms); t.scrollTop = from + dist * (1 - Math.pow(1 - k, 3)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  document.getElementById("jumpTop").onclick = () => glide(target(), 0);
  document.getElementById("jumpEnd").onclick = () => { const t = target(); glide(t, t.scrollHeight - t.clientHeight); };
  addEventListener("scroll", later, { passive: true }); addEventListener("resize", later);
  shade && shade.addEventListener("scroll", later, { passive: true });
  const watch = new MutationObserver((recs) => { if (recs.some((r) => !box.contains(r.target) && r.target !== box)) later(); });
  watch.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
  later();
})();
</script>
