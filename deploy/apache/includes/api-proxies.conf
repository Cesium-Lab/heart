# Rotation Visualizer
ProxyPass /api/rotation/ http://127.0.0.1:42902/api/rotation/
ProxyPassReverse /api/rotation/ http://127.0.0.1:42902/api/rotation/


# Setlister
ProxyPass /api/setlister/ http://127.0.0.1:42903/api/setlister/
ProxyPassReverse /api/setlister/ http://127.0.0.1:42903/api/setlister/

# Planes (SFO board data; the page itself is /planes/ in the Astro build)
ProxyPass /api/planes/ http://127.0.0.1:42901/api/planes/
ProxyPassReverse /api/planes/ http://127.0.0.1:42901/api/planes/

# Inbox. Apache only proxies; the inbox service itself decides who must log in: no login from
# the home LAN and Tailscale, a login page (username + password) for everyone else, including
# everything through the Cloudflare tunnel. It reads the visitor address from the last
# X-Forwarded-For entry, which mod_proxy appends here and visitors can't fake.
# Keep mod_remoteip off; it would change what Apache reports as the visitor address.
RedirectMatch 301 ^/inbox$ /inbox/
ProxyPass /inbox/ http://127.0.0.1:42904/inbox/
ProxyPassReverse /inbox/ http://127.0.0.1:42904/inbox/

# DataViz
ProxyPass /api/dataviz/ http://127.0.0.1:42000/api/v1/
ProxyPassReverse /api/dataviz/ http://127.0.0.1:42000/api/v1/
