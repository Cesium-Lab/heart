<VirtualHost *:80>
    ServerName cesiumlab.net
    ServerAlias www.cesiumlab.net
    ServerAdmin webmaster@localhost

    DocumentRoot /home/cskin/Cesium/heart/frontend/dist
    DirectoryIndex index.html

    <Directory /home/cskin/Cesium/heart/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # nav.js keeps the same name on every change (frontend/public/), so make Cloudflare and
    # browsers check for a newer copy each time instead of serving a cached one.
    <Files "nav.js">
        Header set Cache-Control "no-cache"
    </Files>

    ProxyPreserveHost On
    Include /etc/apache2/cesium/api-proxies.conf

    ErrorLog ${APACHE_LOG_DIR}/cesiumlab-error.log
    CustomLog ${APACHE_LOG_DIR}/cesiumlab-access.log combined
</VirtualHost>
