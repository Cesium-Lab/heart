<VirtualHost *:80>
    ServerName dataviz.cesiumlab.net
    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:42002/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:42002/

    ErrorLog ${APACHE_LOG_DIR}/dataviz-error.log
    CustomLog ${APACHE_LOG_DIR}/dataviz-access.log combined
</VirtualHost>
