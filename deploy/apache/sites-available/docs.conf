<VirtualHost *:80>
    ServerName docs.cesiumlab.net
    ProxyPreserveHost On

    # SilverBullet (backend/services/silverbullet/, docker, 127.0.0.1:42905). It does its own
    # login (SB_USER), so Apache adds none.
    ProxyPass / http://127.0.0.1:42905/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:42905/

    ErrorLog ${APACHE_LOG_DIR}/docs-error.log
    CustomLog ${APACHE_LOG_DIR}/docs-access.log combined
</VirtualHost>
