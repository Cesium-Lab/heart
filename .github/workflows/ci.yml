name: heart-ci

on:
  push:
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier format
        run: npm run format:check

      - name: Build Astro site
        run: |
          npm run build
          test -f dist/index.html

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each service has its own venv on mr-ray, so each gets its own job here.
          - name: setlister
            dir: backend/music/setlister
            requirements: backend/music/setlister/requirements.txt
            import: server
          - name: rotation-viz
            dir: backend/services/rotation-viz
            requirements: backend/services/rotation-viz/requirements.txt
            import: app
          - name: dataviz-backend
            dir: projects/dataviz/backend
            requirements: projects/dataviz/requirements.txt
            import: main
    name: python (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}"

      - name: Import app
        working-directory: ${{ matrix.dir }}
        run: python -c "import ${{ matrix.import }}"

  planes-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, so no install step. Health never calls adsb.lol.
      - name: Start server and check health
        working-directory: backend/services/planes
        run: |
          python server.py &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:42901/api/planes/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:42901/api/planes/health
          # Track lookups need no upstream: an unknown plane returns an empty track.
          curl -fsS http://127.0.0.1:42901/api/planes/track/abc123 | grep -q '"points": \[\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:42901/api/planes/track/not-a-hex)" = 404
          # Replay needs no upstream either: nothing recorded yet means an empty list.
          curl -fsS http://127.0.0.1:42901/api/planes/replay | grep -q '"planes":\[\]'

  inbox-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/services/inbox/requirements.txt

      # Save a note, then check it landed in the day's inbox.md and the digest builds.
      - name: Save an entry and build the digest
        working-directory: backend/services/inbox
        run: |
          export NOTES_DIR="$RUNNER_TEMP/notes"
          INBOX_DIR="$RUNNER_TEMP/inbox" python server.py &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:42904/inbox/health && break; sleep 0.5; done
          # Pretend to be on the home LAN (Apache would add this header); elsewhere needs a login.
          curl -fsS -o /dev/null -H 'X-Forwarded-For: 192.168.0.5' -F 'text=ci check https://example.com' http://127.0.0.1:42904/inbox/add
          grep -q 'ci check' "$RUNNER_TEMP"/inbox/*/inbox.md
          curl -fsS -o /dev/null -H 'X-Forwarded-For: 192.168.0.5' -X POST "http://127.0.0.1:42904/inbox/send/$(date +%F)"
          # From outside, the page is a login form and saving is refused.
          curl -fsS http://127.0.0.1:42904/inbox/ | grep -q 'name="password"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -F 'text=x' http://127.0.0.1:42904/inbox/add)" = 401
          ls "$RUNNER_TEMP"/inbox/*/digest-preview.eml
          # Notes: add an item (no link, so no network), see it listed, and the index counts it.
          curl -fsS -o /dev/null -H 'X-Forwarded-For: 192.168.0.5' -d 'title=ci lick&note=n' http://127.0.0.1:42904/inbox/notes/licks/add
          grep -q '^## ci lick' "$NOTES_DIR/licks.md"
          curl -fsS -H 'X-Forwarded-For: 192.168.0.5' http://127.0.0.1:42904/inbox/notes/licks | grep -q 'ci lick'
          python filing.py 2>&1 | grep -q 'filing.py unfiled'

  tasks-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The main flow: create a course, add an assignment with a subtask, see it as upcoming,
      # mark it done; plus restart persistence and the login/cross-site guards.
      - name: Course, assignment, subtask, done
        working-directory: backend/services/tasks
        run: |
          # Own port, so it can never talk to a real tasks service running on 42906.
          export TASKS_DIR="$RUNNER_TEMP/tasks" TASKS_BACKUP_NEEDS="$RUNNER_TEMP/none" TASKS_PORT=42977
          python3 server.py & sleep 1
          B=http://127.0.0.1:42977/tasks
          H=(-H 'X-Forwarded-For: 192.168.0.5' -H 'X-Tasks: 1' -H 'Content-Type: application/json')
          G=$(curl -fsS "${H[@]}" -d '{"name":"School"}' $B/api/groups | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          T=$(curl -fsS "${H[@]}" -d "{\"title\":\"HW 4\",\"group\":\"$G\",\"due\":\"$(date -d '+3 days' +%F)\"}" $B/api/tasks | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS "${H[@]}" -d "{\"title\":\"Problem 2\",\"parent\":\"$T\"}" $B/api/tasks | grep -q "\"group\": \"$G\""
          curl -fsS "${H[@]}" -X PATCH -d '{"status":"done"}' $B/api/tasks/$T | grep -q '"status": "done"'
          kill %1; sleep 1; python3 server.py & sleep 1
          curl -fsS "${H[@]}" $B/api/state | python3 -c 'import json,sys; d=json.load(sys.stdin); assert [t["status"] for t in d["tasks"] if t["title"]=="HW 4"]==["done"]; assert len(d["tasks"])==2'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 8.8.8.8' $B/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 192.168.0.5' -d '{"title":"x"}' $B/api/tasks)" = 403

  hq-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login is always required: make a throwaway password, log in, add a person linked to an
      # org with a role, a project with a song, then check that deleting the org removes the link.
      - name: Login, link, delete
        working-directory: backend/services/hq
        run: |
          export HQ_DIR="$RUNNER_TEMP/hq" HQ_BACKUP_NEEDS="$RUNNER_TEMP/none" HQ_PORT=42982 INBOX_USERNAME=ci
          export INBOX_PASSWORD_HASH=$(python3 -c 'import hashlib; s="00"*16; print("pbkdf2_sha256$1000$" + s + "$" + hashlib.pbkdf2_hmac("sha256", b"pw", bytes.fromhex(s), 1000).hex())')
          python3 server.py & sleep 1
          B=http://127.0.0.1:42982/hq
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 192.168.0.5' $B/api/state)" = 401
          curl -fsS -c jar -o /dev/null -d 'username=ci&password=pw' $B/login
          H=(-b jar -H 'X-HQ: 1' -H 'Content-Type: application/json')
          id() { python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'; }
          O=$(curl -fsS "${H[@]}" -d '{"name":"MONARCH","type":"Band"}' $B/api/orgs | id)
          P=$(curl -fsS "${H[@]}" -d '{"name":"MONARCH"}' $B/api/projects | id)
          curl -fsS "${H[@]}" -d "{\"name\":\"Song A\",\"project\":\"$P\"}" $B/api/songs >/dev/null
          M=$(curl -fsS "${H[@]}" -d "{\"name\":\"Drummer\",\"links\":[{\"kind\":\"org\",\"id\":\"$O\",\"role\":\"drums\"}]}" $B/api/people | id)
          curl -fsS "${H[@]}" -X DELETE $B/api/orgs/$O >/dev/null
          curl -fsS "${H[@]}" $B/api/state | python3 -c "import json,sys; d=json.load(sys.stdin); p=[x for x in d['people'] if x['id']=='$M'][0]; assert p['links']==[], p; assert len(d['songs'])==1"

  hashcheck-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Baseline, then silently change a file (same size and time): it must be flagged CORRUPT
      # (exit 1), and a missing drive must be refused rather than recorded as "all deleted".
      - name: Catch a silent change
        working-directory: backend/services/hashcheck
        run: |
          export HASHCHECK_DATA_DIR="$RUNNER_TEMP/data" HASHCHECK_STATE_DIR="$RUNNER_TEMP/state"
          mkdir -p "$HASHCHECK_DATA_DIR/photos" && echo a > "$HASHCHECK_DATA_DIR/photos/a.jpg"
          python3 hashcheck.py
          t=$(stat -c %y "$HASHCHECK_DATA_DIR/photos/a.jpg")
          echo z > "$HASHCHECK_DATA_DIR/photos/a.jpg" && touch -d "$t" "$HASHCHECK_DATA_DIR/photos/a.jpg"
          # No pipe here: without pipefail a pipe would report tee's exit code, not hashcheck's.
          if python3 hashcheck.py > out.txt; then cat out.txt; exit 1; fi
          cat out.txt
          grep -q 'CORRUPT (same size and time, different contents): 1' out.txt
          if HASHCHECK_DATA_DIR="$RUNNER_TEMP/nope" python3 hashcheck.py; then exit 1; fi

  lint-everything:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        # Same pin as requirements.txt (used by scripts/lint.sh locally).
        run: python -m pip install ruff==0.17.6

      - name: Settings
        run: python -m ruff --version && python -m ruff check . --show-settings | head -40

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Python syntax (all files, including ones not linted above)
        run: python -m compileall -q backend projects

      - name: Shell scripts
        run: |
          bash -n scripts/*.sh scripts/deploy/*.sh
          shellcheck -x -S warning scripts/*.sh scripts/deploy/*.sh projects/dataviz/start_servers.sh
