services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:42004:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./telemetry_server/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:42003:3000"
    environment:
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_PLUGINS_ALLOW_UNSIGNED_PLUGINS: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    volumes:
      - ./telemetry_server/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data:

